services:
  commander:
    build:
      context: ..
      dockerfile: ai/Dockerfile
    # A crash can leave the expiring cross-process lease behind briefly. Keep
    # retrying until it expires; an intentional `docker compose stop` remains stopped.
    restart: "on-failure"
    stop_grace_period: 15s
    env_file:
      - .env
    volumes:
      - ./data:/app/ai/data
    command: ["python", "-m", "commander.main", "watch"]
